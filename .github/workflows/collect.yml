name: collect

# 自动采集与发布（REFACTOR_PLAN.md 3.8）。
# 调度错开整点；单一互斥组串行化写操作；state/ 随仓库提交作为持久化检查点。

on:
  schedule:
    # 每 4 小时一槽（名义 6/天）：GitHub cron 对本仓库实测有 2.5~4h 延迟
    # 且整槽丢弃（2026-09-29 03:17 槽即被丢弃），超配调度对冲平台丢弃率。
    # 管线幂等、预算按轮独立，多触发只是更早补窗口。
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | backfill | clean"
        required: false
        default: daily

permissions:
  contents: write

concurrency:
  group: collect-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 单次触发循环 3 轮采集（每轮约 40 分钟预算）：平台调度命中率仅约
    # 50%，且入队速度（约 3400/天）超过单轮消化能力——多轮把有效吞吐
    # 提到 2700+/天并降低对调度成功率的依赖。轮间提交检查点，后续轮次
    # 失败不丢已完成进度。
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          case "$MODE" in
            daily)
              for cycle in 1 2 3; do
                echo "=== 采集周期 ${cycle}/3，开始于 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
                python -m collector daily \
                  --scan-requests 300 --scan-minutes 12 \
                  --backfill-limit 1500 --backfill-minutes 16
                if [ "$cycle" -lt 3 ]; then
                  bash scripts/publish_checkpoint.sh
                fi
              done
              ;;
            backfill)
              python -m collector backfill --limit 3000 --budget-minutes 40
              ;;
            clean)
              python -m collector recheck
              python -m collector clean --apply
              python -m collector render
              python -m collector verify
              ;;
            *)
              echo "未知 mode: $MODE"; exit 2 ;;
          esac

      - name: Publish (commit and push)
        run: bash scripts/publish_checkpoint.sh
