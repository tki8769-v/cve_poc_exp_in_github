name: collect

# 自动采集与发布（REFACTOR_PLAN.md 3.8）。
# 调度错开整点；单一互斥组串行化写操作；state/ 随仓库提交作为持久化检查点。

on:
  schedule:
    # 每 4 小时一槽（名义 6/天）：GitHub cron 对本仓库实测有 2.5~4h 延迟
    # 且整槽丢弃（2026-09-29 03:17 槽即被丢弃），超配调度对冲平台丢弃率。
    # 管线幂等、预算按轮独立，多触发只是更早补窗口。
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | backfill | clean"
        required: false
        default: daily

permissions:
  contents: write

concurrency:
  group: collect-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          case "$MODE" in
            daily)
              python -m collector daily \
                --scan-requests 300 --scan-minutes 12 \
                --backfill-limit 1500 --backfill-minutes 16
              ;;
            backfill)
              python -m collector backfill --limit 3000 --budget-minutes 40
              ;;
            clean)
              python -m collector recheck
              python -m collector clean --apply
              python -m collector render
              python -m collector verify
              ;;
            *)
              echo "未知 mode: $MODE"; exit 2 ;;
          esac

      - name: Publish (commit and push)
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          # 显式发布清单（评审 R16）：数据产物 + 状态 + 代码/测试变更
          git add -A -- state PocOrExp.md Today.md '*/README.md' \
            collector tests scripts check_data.py requirements.txt README.md \
            TOKENS.example .gitignore download.py conftest.py .github
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          # 注意：提交消息不得携带 [skip ci] 等跳过标记——GitHub 会对
          # 默认分支 HEAD 应用跳过标记并连带压制 schedule 触发，定时采集
          # 会被自己的数据提交杀死。数据提交不跑 ci 由 ci.yml 的 paths
          # 过滤实现。
          git commit -m "Auto collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 失败（第 ${attempt} 次），rebase 后重验再推送..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { echo "rebase 冲突，人工介入"; exit 1; }
            python -m collector verify || { echo "rebase 后快照验证失败，人工介入"; exit 1; }
          done
          echo "push 重试耗尽"; exit 1
