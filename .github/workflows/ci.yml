name: ci

# 不使用 paths 过滤：push 的路径匹配语义对纯工作流变更不可靠（实测
# e222a4d 未触发），且漏触发代码推送的代价高于数据提交多跑几轮测试
# （公共仓库 ci 免费）。数据提交不抑制 ci 的原因见 collect.yml 注释。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile check
        run: python -m compileall collector
      - name: Tests
        run: python -m pytest tests -q
